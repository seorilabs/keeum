# main 정적 게이트를 조직 Godot 재사용 워크플로우에서 실행한다.
name: Godot Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      godot_version: "4.7.2"
      with_export_templates: false
      runs_on: seorilabs-rpi-arm64
      project_dir: "."
      check_command: |
        node scripts/check_platform_sdk.mjs
        node --test scripts/tests/*.test.mjs
        bash scripts/check_fleet_source_contract.sh
        bash scripts/check_keeum.sh
